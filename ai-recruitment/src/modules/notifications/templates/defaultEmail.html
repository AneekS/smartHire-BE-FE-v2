<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartHire Notification</title>
</head>
<body style="margin:0;padding:0;background:#f4f6fa;font-family:'Segoe UI',Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6fa;padding:40px 0;">
    <tr>
      <td align="center">
        <table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,0.08);">

          <!-- Header -->
          <tr>
            <td style="background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 100%);padding:40px 48px 32px;">
              <table width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td>
                    <span style="font-size:28px;font-weight:800;color:#ffffff;letter-spacing:-0.5px;">Smart<span style="color:#c4b5fd;">Hire</span></span>
                    <span style="display:block;font-size:13px;color:rgba(255,255,255,0.75);margin-top:4px;font-weight:500;">AI-Powered Recruitment</span>
                  </td>
                  <td align="right" style="vertical-align:top;">
                    <span style="background:rgba(255,255,255,0.2);color:#ffffff;font-size:11px;font-weight:600;padding:6px 14px;border-radius:20px;letter-spacing:0.5px;">NOTIFICATION</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:48px 48px 32px;">
              <p style="margin:0 0 12px;font-size:16px;color:#6b7280;">Hi {{userName}},</p>
              <h1 style="margin:0 0 16px;font-size:26px;font-weight:700;color:#111827;line-height:1.3;">{{title}}</h1>
              <p style="margin:0 0 32px;font-size:16px;color:#4b5563;line-height:1.7;">{{message}}</p>

              <!-- CTA Button -->
              <table cellpadding="0" cellspacing="0">
                <tr>
                  <td style="background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:10px;">
                    <a href="{{ctaUrl}}" style="display:inline-block;padding:14px 32px;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;">{{ctaText}}</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Divider -->
          <tr><td style="padding:0 48px;"><div style="height:1px;background:#e5e7eb;"></div></td></tr>

          <!-- Footer -->
          <tr>
            <td style="padding:24px 48px 40px;">
              <p style="margin:0 0 8px;font-size:13px;color:#9ca3af;">You received this email because you have notifications enabled on SmartHire. <a href="{{appUrl}}/dashboard/notifications/preferences" style="color:#6366f1;text-decoration:none;">Manage preferences</a></p>
              <p style="margin:0;font-size:12px;color:#d1d5db;">© {{year}} SmartHire AI. All rights reserved.</p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>

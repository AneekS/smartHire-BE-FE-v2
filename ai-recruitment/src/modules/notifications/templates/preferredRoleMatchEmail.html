<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Role Match - SmartHire</title>
</head>
<body style="margin:0;padding:0;background:#eef3ff;font-family:'Segoe UI',Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="padding:28px 12px;background:#eef3ff;">
    <tr>
      <td align="center">
        <table width="100%" cellpadding="0" cellspacing="0" style="max-width:620px;background:#ffffff;border-radius:18px;overflow:hidden;box-shadow:0 8px 28px rgba(26,46,92,0.12);">
          <tr>
            <td style="background:linear-gradient(120deg,#0f172a 0%,#1d4ed8 60%,#0ea5e9 100%);padding:32px 28px;">
              <p style="margin:0;font-size:12px;letter-spacing:1px;color:#dbeafe;text-transform:uppercase;font-weight:700;">Preferred Role Match</p>
              <h1 style="margin:10px 0 0;font-size:28px;line-height:1.2;color:#ffffff;">{{title}}</h1>
            </td>
          </tr>

          <tr>
            <td style="padding:28px 28px 18px;">
              <p style="margin:0 0 14px;font-size:16px;color:#334155;">Hi {{userName}},</p>
              <p style="margin:0 0 20px;font-size:15px;line-height:1.7;color:#475569;">{{message}}</p>

              <div style="border:1px solid #dbeafe;border-radius:14px;padding:18px;background:#f8fbff;">
                <p style="margin:0 0 6px;font-size:18px;font-weight:700;color:#0f172a;">{{jobTitle}}</p>
                <p style="margin:0 0 14px;font-size:14px;color:#475569;">{{companyName}}</p>
                <p style="margin:0;font-size:14px;color:#1e3a8a;font-weight:600;">Salary: {{offerAmount}}</p>
              </div>

              <table cellpadding="0" cellspacing="0" style="margin-top:22px;">
                <tr>
                  <td style="background:#1d4ed8;border-radius:10px;">
                    <a href="{{ctaUrl}}" style="display:inline-block;padding:12px 20px;color:#ffffff;text-decoration:none;font-size:14px;font-weight:700;">View job -> SmartHire</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <tr>
            <td style="padding:14px 28px 28px;border-top:1px solid #e2e8f0;">
              <p style="margin:0 0 8px;font-size:12px;color:#64748b;">You're receiving this because role-matching alerts are enabled.</p>
              <p style="margin:0;font-size:12px;color:#64748b;">
                <a href="{{appUrl}}/dashboard/notifications/preferences" style="color:#1d4ed8;text-decoration:none;">Manage notifications</a>
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>

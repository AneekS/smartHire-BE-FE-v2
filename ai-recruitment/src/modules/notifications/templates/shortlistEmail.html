<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You've Been Shortlisted — SmartHire</title>
</head>
<body style="margin:0;padding:0;background:#f4f6fa;font-family:'Segoe UI',Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6fa;padding:40px 0;">
    <tr>
      <td align="center">
        <table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,0.08);">

          <!-- Header with confetti feel -->
          <tr>
            <td style="background:linear-gradient(135deg,#f59e0b 0%,#ef4444 100%);padding:40px 48px 32px;">
              <table width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td>
                    <span style="font-size:28px;font-weight:800;color:#ffffff;">Smart<span style="color:#fde68a;">Hire</span></span>
                    <span style="display:block;font-size:13px;color:rgba(255,255,255,0.8);margin-top:4px;">AI-Powered Recruitment</span>
                  </td>
                  <td align="right">
                    <span style="font-size:36px;">🎉</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:48px 48px 24px;">
              <p style="margin:0 0 8px;font-size:16px;color:#6b7280;">Hi {{userName}},</p>
              <h1 style="margin:0 0 16px;font-size:26px;font-weight:700;color:#111827;line-height:1.3;">{{title}}</h1>
              <p style="margin:0 0 32px;font-size:16px;color:#4b5563;line-height:1.7;">{{message}}</p>

              <!-- Highlight card -->
              <div style="background:linear-gradient(135deg,#fffbeb,#fff7ed);border:1px solid #fde68a;border-radius:12px;padding:24px;margin-bottom:32px;text-align:center;">
                <p style="margin:0 0 4px;font-size:20px;font-weight:800;color:#b45309;">{{jobTitle}}</p>
                <p style="margin:0;font-size:15px;color:#92400e;">{{companyName}}</p>
              </div>

              <table cellpadding="0" cellspacing="0">
                <tr>
                  <td style="background:linear-gradient(135deg,#f59e0b,#ef4444);border-radius:10px;">
                    <a href="{{ctaUrl}}" style="display:inline-block;padding:14px 32px;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;">View Application Status →</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <tr><td style="padding:32px 48px 0;"><div style="height:1px;background:#e5e7eb;"></div></td></tr>
          <tr>
            <td style="padding:24px 48px 40px;">
              <p style="margin:0 0 8px;font-size:13px;color:#9ca3af;"><a href="{{appUrl}}/dashboard/notifications/preferences" style="color:#6366f1;text-decoration:none;">Manage preferences</a></p>
              <p style="margin:0;font-size:12px;color:#d1d5db;">© {{year}} SmartHire AI. All rights reserved.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>

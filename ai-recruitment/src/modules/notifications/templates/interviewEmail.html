<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interview Update — SmartHire</title>
</head>
<body style="margin:0;padding:0;background:#f4f6fa;font-family:'Segoe UI',Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6fa;padding:40px 0;">
    <tr>
      <td align="center">
        <table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,0.08);">

          <!-- Header -->
          <tr>
            <td style="background:linear-gradient(135deg,#10b981 0%,#0ea5e9 100%);padding:40px 48px 32px;">
              <table width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td>
                    <span style="font-size:28px;font-weight:800;color:#ffffff;">Smart<span style="color:#a7f3d0;">Hire</span></span>
                    <span style="display:block;font-size:13px;color:rgba(255,255,255,0.75);margin-top:4px;">AI-Powered Recruitment</span>
                  </td>
                  <td align="right">
                    <span style="background:rgba(255,255,255,0.2);color:#ffffff;font-size:11px;font-weight:700;padding:6px 14px;border-radius:20px;letter-spacing:0.5px;">INTERVIEW</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:48px 48px 24px;">
              <p style="margin:0 0 8px;font-size:16px;color:#6b7280;">Hi {{userName}},</p>
              <h1 style="margin:0 0 16px;font-size:26px;font-weight:700;color:#111827;line-height:1.3;">{{title}}</h1>
              <p style="margin:0 0 32px;font-size:16px;color:#4b5563;line-height:1.7;">{{message}}</p>

              <!-- Interview Details Card -->
              <div style="background:#ecfdf5;border:1px solid #a7f3d0;border-radius:12px;padding:24px;margin-bottom:32px;">
                <table width="100%" cellpadding="0" cellspacing="12">
                  <tr>
                    <td style="font-size:13px;color:#6b7280;font-weight:600;padding-bottom:4px;">ROLE</td>
                    <td style="font-size:15px;color:#111827;font-weight:600;">{{jobTitle}}</td>
                  </tr>
                  <tr>
                    <td style="font-size:13px;color:#6b7280;font-weight:600;padding-bottom:4px;">COMPANY</td>
                    <td style="font-size:15px;color:#111827;">{{companyName}}</td>
                  </tr>
                  <tr>
                    <td style="font-size:13px;color:#6b7280;font-weight:600;padding-bottom:4px;">SCHEDULED</td>
                    <td style="font-size:15px;color:#111827;">{{scheduledAt}}</td>
                  </tr>
                </table>
              </div>

              <!-- CTA Buttons -->
              <table cellpadding="0" cellspacing="0">
                <tr>
                  <td style="padding-right:12px;">
                    <a href="{{meetingUrl}}" style="display:inline-block;padding:13px 26px;background:linear-gradient(135deg,#10b981,#0ea5e9);border-radius:10px;font-size:14px;font-weight:600;color:#ffffff;text-decoration:none;">Join Meeting →</a>
                  </td>
                  <td>
                    <a href="{{ctaUrl}}" style="display:inline-block;padding:13px 26px;background:#f1f5f9;border-radius:10px;font-size:14px;font-weight:600;color:#374151;text-decoration:none;">View Application</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <tr><td style="padding:32px 48px 0;"><div style="height:1px;background:#e5e7eb;"></div></td></tr>
          <tr>
            <td style="padding:24px 48px 40px;">
              <p style="margin:0 0 8px;font-size:13px;color:#9ca3af;"><a href="{{appUrl}}/dashboard/notifications/preferences" style="color:#6366f1;text-decoration:none;">Manage preferences</a></p>
              <p style="margin:0;font-size:12px;color:#d1d5db;">© {{year}} SmartHire AI. All rights reserved.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
